{% extends "budget/base.html" %}
{% block title %}כניסה · GrantWise{% endblock %}
{% block content %}
<section class="card login-card" aria-labelledby="login-title">
  <h1 id="login-title">כניסה למערכת</h1>
  <p class="login-description">התחברות לסביבת העבודה לניהול מענקים ותקציבים</p>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<ul class="msgs" role="alert"><li class="error">שם המשתמש או הסיסמה שגויים. יש לנסות שוב.</li></ul>{% endif %}
    <div class="login-field">
      <label for="username">שם משתמש</label>
      <input id="username" class="f" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="login-field">
      <label for="password">סיסמה</label>
      <input id="password" class="f" type="password" name="password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">כניסה למערכת</button>
  </form>
</section>
{% endblock %}
