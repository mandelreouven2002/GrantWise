{% with col=c.col k=c.col.kind %}{% if k == "ro" or k == "calc" %}<td class="ro{% if k == 'calc' %} num{% endif %}">{{ c.value }}</td>{% elif k == "bool" %}<td class="chk"><input type="checkbox" class="cell" data-f="{{ col.field }}" {% if c.value %}checked{% endif %}></td>{% elif c.choices %}<td><select class="cell {{ col.width }}" data-f="{{ col.field }}">{% for v, l in c.choices %}<option value="{{ v }}" {% if v == c.value %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></td>{% elif k == "date" %}<td><input type="date" class="cell" data-f="{{ col.field }}" value="{{ c.value }}"></td>{% elif k == "money" or k == "num" or k == "int" or k == "line" %}<td><input class="cell num{% if c.neg %} neg{% endif %}" data-num inputmode="decimal" data-f="{{ col.field }}" value="{{ c.value }}">{% if c.after %}<div class="after" title="יתרת SAP פחות החלטות שאושרו ו-SAP עוד לא רואה">אחרי החלטות: {{ c.after }}</div>{% endif %}</td>{% else %}<td><input class="cell {{ col.width }}" dir="auto" data-f="{{ col.field }}" value="{{ c.value }}" title="{{ c.value }}"></td>{% endif %}{% endwith %}
